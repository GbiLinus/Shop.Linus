<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATELIER</title>
<meta name="description" content="Das Haus der Marken: mit dem gläsernen Aufzug durch zehn Läden fahren.">
<meta name="theme-color" content="#f7f6f3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23151515'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' fill='%23fff' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preload" href="assets/fonts/cormorant.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/vendor/lenis.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="home" class="home">
<main id="main">
<section class="lift-scene" id="lift" aria-label="Gläserner Aufzug">
  <div class="shaft"><div class="floors" id="floors"></div></div>
  <div class="cabin">
    <div class="cab-glass l"></div>
    <div class="cab-doors"><div class="cab-door l"></div><div class="cab-door r"></div></div>
    <div class="cab-glass r"></div>
    <span class="cab-rail"></span>
    <span class="cab-post l"></span><span class="cab-post r"></span>
    <div class="cab-beam"><div class="cab-display" aria-live="polite"><span class="arrow" id="d-arrow">•</span><span class="dnum" id="d-num">E</span><span id="d-name">ATELIER</span></div></div>
    <div class="cab-sill"></div>
    <nav class="cab-panel" id="cab-panel" aria-label="Aufzug: Etage wählen"></nav>
  </div>
</section>
<div class="veil" id="veil" aria-hidden="true"></div>

<section class="section wrap">
  <div class="section-head">
    <div><span class="eyebrow">Gerade eingetroffen</span><h2>Neu im Haus</h2></div>
    <a class="link caps" href="shop.html?neu=1">Alle Neuheiten</a>
  </div>
  <div class="grid" id="home-new"></div>
</section>

<section class="wrap">
  <div class="promises">
    <div><strong>Kostenloser Versand</strong><span>ab 250 € innerhalb der EU</span></div>
    <div><strong>30 Tage Rückgabe</strong><span>kostenlos und unkompliziert</span></div>
    <div><strong>Nur Originalware</strong><span>direkt von den Marken</span></div>
    <div><strong>Persönliche Beratung</strong><span>per E-Mail und Telefon</span></div>
  </div>
</section>

<section class="section wrap newsletter">
  <span class="eyebrow">Newsletter</span>
  <h2 style="margin-top:14px">Neue Marken zuerst erfahren</h2>
  <form data-form="newsletter" novalidate>
    <label class="sr-only" for="nl-home">E-Mail-Adresse</label>
    <input id="nl-home" type="email" placeholder="E-Mail-Adresse" autocomplete="email">
    <button type="submit">Anmelden</button>
  </form>
  <div class="form-note" aria-live="polite"></div>
</section>
</main>
<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/vendor/ScrollTrigger.min.js"></script>
<script src="assets/vendor/lenis.min.js"></script>
<script src="assets/data.js"></script>
<script src="assets/garments.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
